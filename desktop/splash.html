<!doctype html>
<meta charset="utf-8">
<title>Woboo</title>
<style>
  /* The launcher. Frameless and transparent — everything you see is drawn.
     The boot lines are real checks, not a fake progress bar: Woboo is genuinely
     finding the crew and waking the brain while you watch it. */
  html, body {
    margin: 0; height: 100%; background: transparent; overflow: hidden;
    font: 12px/1.5 ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
    color: #F5F1EC; user-select: none; cursor: default;
  }
  :root { --fc: #FFB55C; }

  .card {
    position: relative; height: 100%; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center;
    padding: 26px 26px 20px;
    border-radius: 20px;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(255,120,70,.14) 0%, transparent 60%),
      linear-gradient(165deg, #12100F 0%, #0A0809 60%, #08080B 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.05),
      0 0 0 1px rgba(0,0,0,.7),
      0 24px 60px rgba(0,0,0,.6);
    -webkit-app-region: drag;
    overflow: hidden;
  }
  /* A slow sweep of light, so the card feels alive while it works. */
  .card::before {
    content: ''; position: absolute; inset: -40%;
    background: conic-gradient(from 0deg, transparent 0 82%, rgba(255,120,70,.22) 92%, transparent 100%);
    animation: sweep 6s linear infinite; pointer-events: none;
  }
  @keyframes sweep { to { transform: rotate(360deg); } }
  .card::after {
    content: ''; position: absolute; inset: 1px; border-radius: 19px;
    background: inherit; pointer-events: none;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(255,120,70,.14) 0%, transparent 60%),
      linear-gradient(165deg, #12100F 0%, #0A0809 60%, #08080B 100%);
  }
  .card > * { position: relative; z-index: 1; }

  /* The launcher shows the character itself — the same render the site leads
     with — rather than a CSS approximation of it. It bobs, and the antenna
     bulb pulses in the state colour over the top. */
  .head {
    position: relative; width: 150px; height: 150px; flex: none;
    animation: bob 6s ease-in-out infinite;
  }
  .head img { width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 24px 34px rgba(0,0,0,.62)); }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }

  /* The warm halo the character sits in on the site. */
  .head::before {
    content: ''; position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%);
    width: 150%; aspect-ratio: 1; border-radius: 50%; z-index: -1;
    background: radial-gradient(circle, var(--fc), transparent 62%);
    opacity: .22; filter: blur(12px); transition: background .6s ease;
  }
  /* The bulb, lit in whatever Woboo is currently feeling. */
  .antenna {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 15px; height: 15px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 36% 32%, #FFF1DC, var(--fc) 52%, #FF6B3D 100%);
    box-shadow: 0 0 18px var(--fc), 0 0 40px -6px #FF6B3D;
    animation: breathe 2.4s ease-in-out infinite; mix-blend-mode: screen;
  }
  @keyframes breathe { 0%,100% { opacity:.45 } 50% { opacity:1 } }
  .screen { display: none; }
  #face { display: none; }

  .brand {
    margin-top: 16px; font-size: 20px; font-weight: 700;
    letter-spacing: 9px; text-indent: 9px; color: #FFFFFF;
  }
  .tagline { margin-top: 2px; color: rgba(255,255,255,.38); font-size: 10.5px; letter-spacing: .5px; }

  .rail {
    margin-top: 18px; width: 100%; height: 2px; border-radius: 2px;
    background: rgba(255,255,255,.08); overflow: hidden;
  }
  .rail i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, transparent, var(--fc));
    box-shadow: 0 0 10px var(--fc);
    transition: width .45s cubic-bezier(.22,.9,.3,1), background .6s ease;
  }

  .steps { margin-top: 12px; width: 100%; flex: 1; min-height: 0; overflow: hidden; }
  .step {
    display: flex; gap: 8px; align-items: baseline; padding: 1.5px 0;
    color: rgba(255,255,255,.38); opacity: 0; transform: translateY(4px);
    animation: rise .28s ease forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .step .g { width: 10px; flex: none; text-align: center; }
  .step.ok { color: rgba(255,255,255,.62); }
  .step.ok .g { color: var(--fc); }
  .step.warn { color: #FF9264; }
  .step.warn .g { color: #FF9264; }
  .step .detail { color: rgba(255,255,255,.3); margin-left: auto; font-size: 10.5px; }

  .foot { margin-top: auto; padding-top: 8px; color: rgba(255,255,255,.28); font-size: 10px; letter-spacing: 1px; }
</style>

<div class="card">
  <div class="head" id="head">
    <img src="../assets/wobo.png" alt="Woboo">
    <div class="antenna"></div>
  </div>

  <div class="brand">WOBOO</div>
  <div class="tagline">a body for your AI</div>

  <div class="rail"><i id="bar"></i></div>
  <div class="steps" id="steps"></div>
  <div class="foot" id="foot">starting…</div>
</div>

<style id="face-css"></style>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var total = 6;
  var done = 0;

  function esc(t) {
    return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  window.wobo.onFace(function (painted) {
    $('face').innerHTML = painted.svg;
    document.documentElement.style.setProperty('--fc', painted.color);
  });

  // Each line is a real check that just finished — the launcher is showing you
  // the boot, not animating a stand-in for it.
  window.wobo.onBoot(function (step) {
    if (step.done) {
      $('foot').textContent = 'ready';
      $('bar').style.width = '100%';
      return;
    }
    done += 1;
    $('bar').style.width = Math.min(100, Math.round((done / total) * 100)) + '%';
    $('foot').textContent = step.label;

    var el = document.createElement('div');
    el.className = 'step ' + (step.level || 'ok');
    el.innerHTML = '<span class="g">' + (step.level === 'warn' ? '!' : '+') + '</span>' +
      '<span>' + esc(step.label) + '</span>' +
      '<span class="detail">' + esc(step.detail || '') + '</span>';
    $('steps').appendChild(el);
    while ($('steps').childElementCount > 7) $('steps').removeChild($('steps').firstElementChild);
  });

  window.wobo.snapshot().then(function (snap) {
    $('face-css').textContent = snap.css;
    $('face').setAttribute('viewBox', snap.viewBox);
  });
</script>
